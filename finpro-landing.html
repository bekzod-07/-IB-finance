<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FinPro — Buxgalteriya Xizmatlari</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#050c1a;color:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-family:'DM Sans',sans-serif}
a{text-decoration:none}ul{list-style:none}button{cursor:pointer}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#050c1a}::-webkit-scrollbar-thumb{background:rgba(37,99,235,.4);border-radius:3px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp .7s ease forwards}
input:-webkit-autofill,textarea:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px #0a1628 inset;-webkit-text-fill-color:#fff;caret-color:#fff}

#navbar{position:fixed;top:0;left:0;right:0;z-index:999;padding:0 24px;transition:all .3s ease}
#navbar.scrolled{background:rgba(10,15,30,.97);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#2563eb,#0ea5e9);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;font-family:'Playfair Display',serif}
.logo-text{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#fff}
.nav-links{display:flex;gap:28px;align-items:center}
.nav-link{background:none;border:none;color:rgba(255,255,255,.7);font-size:14px;font-family:'DM Sans',sans-serif;padding:4px 0;transition:color .2s}.nav-link:hover{color:#fff}
.lang-sw{display:flex;background:rgba(255,255,255,.08);border-radius:8px;padding:3px;gap:2px}
.lang-btn{background:transparent;border:none;color:rgba(255,255,255,.5);font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;transition:all .2s;letter-spacing:.05em;text-transform:uppercase;font-family:'DM Sans',sans-serif}
.lang-btn.active{background:rgba(255,255,255,.15);color:#fff}
.nav-cta{background:linear-gradient(135deg,#2563eb,#0ea5e9);border:none;color:#fff;font-size:13px;font-weight:600;padding:10px 20px;border-radius:10px;font-family:'DM Sans',sans-serif;transition:opacity .2s;white-space:nowrap}.nav-cta:hover{opacity:.85}
.hamburger{display:none;background:none;border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;width:40px;height:40px;align-items:center;justify-content:center;font-size:18px}
.mobile-menu{display:none;background:rgba(10,15,30,.98);border-top:1px solid rgba(255,255,255,.06);padding:16px 24px 24px}
.mobile-menu.open{display:block}
.mobile-link{display:block;width:100%;text-align:left;background:none;border:none;color:rgba(255,255,255,.8);font-size:15px;font-family:'DM Sans',sans-serif;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.mobile-cta{margin-top:16px;width:100%;background:linear-gradient(135deg,#2563eb,#0ea5e9);border:none;color:#fff;font-size:14px;font-weight:600;padding:12px;border-radius:10px;font-family:'DM Sans',sans-serif}

.section-badge{display:inline-block;border-radius:100px;padding:5px 18px;margin-bottom:16px}
.section-badge span{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.section-title{font-family:'Playfair Display',serif;font-size:clamp(28px,3.5vw,44px);font-weight:700;color:#fff;margin-bottom:16px;letter-spacing:-.02em}
.section-sub{font-size:16px;color:rgba(255,255,255,.5);max-width:560px;margin:0 auto;line-height:1.7}
.section-head{text-align:center;margin-bottom:64px}
.sep{position:absolute;top:0;left:0;right:0;height:1px}
.wrap{max-width:1200px;margin:0 auto}

/* icon containers */
.icon-box{width:52px;height:52px;background:rgba(37,99,235,.12);border:1px solid rgba(37,99,235,.2);border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.icon-box-sm{width:44px;height:44px;background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.icon-contact{width:42px;height:42px;background:rgba(37,99,235,.12);border:1px solid rgba(37,99,235,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* HERO */
#hero{min-height:100vh;background:linear-gradient(135deg,#050c1a 0%,#0a1628 40%,#0d1f3c 100%);display:flex;align-items:center;position:relative;overflow:hidden;padding:120px 24px 80px}
.hero-orb1{position:absolute;top:10%;right:-5%;width:600px;height:600px;background:radial-gradient(circle,rgba(37,99,235,.18) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.hero-orb2{position:absolute;bottom:-10%;left:-5%;width:400px;height:400px;background:radial-gradient(circle,rgba(14,165,233,.12) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.hero-grid{max-width:1200px;margin:0 auto;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(37,99,235,.12);border:1px solid rgba(37,99,235,.3);border-radius:100px;padding:6px 16px;margin-bottom:28px}
.hero-dot{width:6px;height:6px;background:#0ea5e9;border-radius:50%;animation:pulse 2s infinite}
.hero-h1{font-family:'Playfair Display',serif;font-size:clamp(36px,4.5vw,58px);font-weight:700;color:#fff;line-height:1.15;margin-bottom:24px;letter-spacing:-.02em}
.hero-accent{background:linear-gradient(90deg,#2563eb,#0ea5e9,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-p{font-size:17px;color:rgba(255,255,255,.6);line-height:1.75;margin-bottom:40px;max-width:480px}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap}
.btn-primary{background:linear-gradient(135deg,#2563eb,#0ea5e9);border:none;color:#fff;font-size:15px;font-weight:600;padding:14px 28px;border-radius:12px;font-family:'DM Sans',sans-serif;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 30px rgba(37,99,235,.35)}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(37,99,235,.45)}
.btn-secondary{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.85);font-size:15px;font-weight:500;padding:14px 28px;border-radius:12px;font-family:'DM Sans',sans-serif;transition:background .2s}.btn-secondary:hover{background:rgba(255,255,255,.1)}
.hero-stats{display:flex;gap:40px;margin-top:52px;padding-top:40px;border-top:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
.stat-val{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:#fff;line-height:1;margin-bottom:4px}
.stat-lbl{font-size:13px;color:rgba(255,255,255,.45);letter-spacing:.02em}
.hero-card{width:100%;max-width:440px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:32px;backdrop-filter:blur(20px)}
.hero-card-header{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.hero-card-icon{width:40px;height:40px;background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.3);border-radius:10px;display:flex;align-items:center;justify-content:center}
.bar-row{margin-bottom:16px}.bar-meta{display:flex;justify-content:space-between;margin-bottom:6px}
.bar-label{font-size:12px;color:rgba(255,255,255,.45)}.bar-pct{font-size:12px;font-weight:600;color:#fff}
.bar-track{height:6px;background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#2563eb,#0ea5e9);border-radius:100px}
.bar-fill.alt{background:linear-gradient(90deg,#0ea5e9,#38bdf8)}
.hero-success{margin-top:28px;padding:16px;background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.2);border-radius:12px;display:flex;align-items:center;gap:12px}
.hero-success-icon{width:36px;height:36px;background:rgba(34,197,94,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero-float{position:absolute;top:-20px;right:-20px;background:rgba(10,15,30,.9);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 16px;backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px}
.hero-float-icon{width:32px;height:32px;background:rgba(251,191,36,.15);border-radius:8px;display:flex;align-items:center;justify-content:center}
.hero-visual-wrap{position:relative;display:flex;justify-content:center;align-items:center}

/* SERVICES */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.svc-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:32px;transition:all .3s ease}
.svc-card:hover{background:rgba(37,99,235,.06);border-color:rgba(37,99,235,.25);transform:translateY(-4px);box-shadow:0 20px 60px rgba(37,99,235,.1)}
.svc-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:10px;letter-spacing:-.01em}
.svc-desc{font-size:14px;color:rgba(255,255,255,.5);line-height:1.75}

/* WHY */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.badges-row{display:flex;gap:12px;flex-wrap:wrap}
.trust-badge{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 16px}
.why-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.why-card{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:24px;transition:all .3s ease}
.why-card:hover{background:rgba(14,165,233,.06);border-color:rgba(14,165,233,.2)}
.why-title{font-size:15px;font-weight:700;color:#fff;margin-bottom:8px}
.why-desc{font-size:13px;color:rgba(255,255,255,.45);line-height:1.65}

/* PARTNERS */
.partners-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px}
.partner-card{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:all .3s ease;text-align:center}
.partner-card:hover{transform:translateY(-5px);box-shadow:0 20px 50px rgba(0,0,0,.2)}
.partner-logo{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.partner-name{font-size:14px;font-weight:700;color:#fff;line-height:1.3}
.partner-type{font-size:12px;color:rgba(255,255,255,.4);margin-top:2px}

/* TESTIMONIALS */
.testi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.testi-card{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:28px;transition:all .3s ease}
.testi-card:hover{transform:translateY(-4px)}
.testi-quote-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.testi-text{font-size:14px;color:rgba(255,255,255,.65);line-height:1.75;margin-bottom:24px;font-style:italic}
.testi-footer{display:flex;align-items:center;gap:12px;padding-top:20px;border-top:1px solid rgba(255,255,255,.06)}
.testi-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.testi-name{font-size:14px;font-weight:700;color:#fff}.testi-role{font-size:12px;color:rgba(255,255,255,.4)}
.testi-stars{margin-left:auto;display:flex;gap:2px}

/* ABOUT */
.about-text{font-size:15px;color:rgba(255,255,255,.55);line-height:1.8;margin-bottom:16px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.stat-box{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:28px;text-align:center;transition:all .3s ease}
.stat-box:hover{background:rgba(13,148,136,.06);border-color:rgba(13,148,136,.2);transform:scale(1.03)}
.stat-big{font-family:'Playfair Display',serif;font-size:40px;font-weight:700;background:linear-gradient(135deg,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.02em;margin-bottom:6px}
.stat-small{font-size:13px;color:rgba(255,255,255,.4);line-height:1.4}

/* CONTACT */
.contact-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:48px;align-items:start}
.contact-items{display:flex;flex-direction:column;gap:16px}
.contact-item{display:flex;align-items:flex-start;gap:16px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:18px 20px;transition:all .25s ease}
.contact-item:hover{background:rgba(37,99,235,.06);border-color:rgba(37,99,235,.2)}
.contact-val a{font-size:15px;font-weight:500;color:#93c5fd}
.contact-val-plain{font-size:14px;color:rgba(255,255,255,.6);line-height:1.6}
.contact-form-wrap{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:24px;padding:36px}
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:13px;font-weight:500;color:rgba(255,255,255,.6);margin-bottom:8px}
.form-input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:14px;color:#fff;outline:none;transition:border .2s}
.form-input:focus{border-color:rgba(37,99,235,.5)}.form-input.error{border-color:rgba(239,68,68,.5)}
.form-error{font-size:12px;color:#f87171;margin-top:4px;display:none}
.form-textarea{resize:vertical}
.form-submit{width:100%;background:linear-gradient(135deg,#2563eb,#0ea5e9);border:none;color:#fff;font-size:15px;font-weight:600;padding:14px;border-radius:12px;font-family:'DM Sans',sans-serif;transition:opacity .2s,transform .2s;box-shadow:0 8px 24px rgba(37,99,235,.3);display:flex;align-items:center;justify-content:center;gap:8px}
.form-submit:hover{opacity:.9;transform:translateY(-1px)}.form-submit:disabled{opacity:.6;cursor:not-allowed;transform:none}
.form-success{text-align:center;padding:40px 0}
.form-success-svg{width:64px;height:64px;background:rgba(34,197,94,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.form-success-text{font-size:16px;color:#4ade80;font-weight:600;line-height:1.6}

/* FOOTER */
footer{background:#030810;border-top:1px solid rgba(255,255,255,.05);padding:64px 24px 32px}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr;gap:48px;margin-bottom:52px}
.footer-desc{font-size:14px;color:rgba(255,255,255,.4);line-height:1.75;max-width:260px;margin-bottom:20px}
.footer-socials{display:flex;gap:10px}
.social-btn{width:36px;height:36px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:9px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.social-btn:hover{background:rgba(37,99,235,.15);border-color:rgba(37,99,235,.3)}
.footer-col-title{font-size:13px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.08em;margin-bottom:20px}
.footer-link{background:none;border:none;padding:0;font-family:'DM Sans',sans-serif;font-size:14px;color:rgba(255,255,255,.4);display:block;margin-bottom:12px;transition:color .2s;text-align:left}.footer-link:hover{color:#93c5fd}
.footer-cl{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.4);margin-bottom:12px;transition:color .2s}.footer-cl:hover{color:#93c5fd}
.footer-bottom{border-top:1px solid rgba(255,255,255,.05);padding-top:28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.footer-copy{font-size:13px;color:rgba(255,255,255,.25)}

@media(max-width:900px){
  .nav-links,.nav-cta{display:none}.hamburger{display:flex}
  .hero-grid{grid-template-columns:1fr;gap:40px}.hero-visual-wrap{display:none}
  .two-col{grid-template-columns:1fr;gap:40px}
  .contact-grid{grid-template-columns:1fr;gap:32px}
  .footer-grid{grid-template-columns:1fr 1fr;gap:32px}
}
@media(max-width:600px){
  .footer-grid{grid-template-columns:1fr}.why-cards{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr}
}
</style>
</head>

let lang='uz';

const ic=(id,sz=24,cl='#60a5fa')=>`<svg viewBox="0 0 24 24" style="width:${sz}px;height:${sz}px;stroke:${cl};fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><use href="#${id}"/></svg>`;

function goTo(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth'})}

function setLang(l){lang=l;document.getElementById('btn-uz').classList.toggle('active',l==='uz');document.getElementById('btn-ru').classList.toggle('active',l==='ru');render()}

function toggleMenu(){
  const m=document.getElementById('mobileMenu');
  const o=m.classList.toggle('open');
  document.getElementById('hamBtn').textContent=o?'✕':'☰';
}

async function sendToTelegram(name,phone,msg){
  const text=`📩 <b>Yangi murojaat — FinPro</b>\n\n👤 <b>Ism:</b> ${name}\n📞 <b>Tel:</b> ${phone}\n💬 <b>Xabar:</b> ${msg}\n\n🕐 ${new Date().toLocaleString()}`;
  try{
    const r=await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CHAT_ID,text,parse_mode:'HTML'})});
    return r.ok;
  }catch{return false}
}

async function submitForm(){
  const t=T[lang].contact;
  const name=document.getElementById('fN').value.trim();
  const phone=document.getElementById('fP').value.trim();
  const msg=document.getElementById('fM').value.trim();
  let ok=true;
  const e=(eid,iid,bad)=>{document.getElementById(eid).style.display=bad?'block':'none';document.getElementById(iid).classList.toggle('error',bad);if(bad)ok=false};
  e('eN','fN',!name);
  e('eP','fP',!phone||!/^\+?[\d\s\-()\d]{9,}$/.test(phone));
  e('eM','fM',!msg);
  if(!ok)return;
  const btn=document.getElementById('fBtn');
  btn.disabled=true;
  btn.innerHTML=`<svg style="width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;animation:spin .8s linear infinite" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" opacity=".2"/><path d="M12 2a10 10 0 0 1 10 10"/></svg> ${t.sending}`;
  const sent=await sendToTelegram(name,phone,msg);
  if(sent){
    document.getElementById('cForm').innerHTML=`<div class="form-success"><div class="form-success-svg">${ic('i-check',32,'#4ade80')}</div><p class="form-success-text">${t.fsuc}</p><button onclick="renderForm()" style="margin-top:20px;background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);font-size:13px;padding:8px 20px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif">← Orqaga</button></div>`;
  }else{
    btn.disabled=false;
    renderForm();
    alert('Xatolik yuz berdi. Iltimos, to\'g\'ridan-to\'g\'ri Telegram orqali murojaat qiling.');
  }
}

    <div class="form-group"><label class="form-label">${t.fp} *</label><input class="form-input" id="fP" type="tel" placeholder="+998 93 111 20 21"/><p class="form-error" id="eP">${t.ep}</p></div>
